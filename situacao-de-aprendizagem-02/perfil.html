<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Usuário - NovaWeb Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="perfil.html">NovaWeb Studio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="perfil.html">Meu Perfil</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="consulta.html">Consulta</a>
          </li>
        </ul>
        <a href="index.html" class="btn btn-outline-light btn-sm">Sair</a>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="row">
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm text-center p-3">
          <div class="card-body">
            <img src="static/images/avatar.png" alt="Foto do Usuário" class="foto-perfil rounded-circle img-thumbnail mb-3">
            <h5 class="card-title mb-1">Lucas Mendes</h5>
            <p class="text-muted small mb-2">Desenvolvedor Front-end</p>
            <span class="badge bg-success mb-3">Ativo</span>
            <hr>
            <p class="small text-start mb-1"><strong>E-mail:</strong> lucas@novaweb.com</p>
            <p class="small text-start mb-1"><strong>Departamento:</strong> TI</p>
            <p class="small text-start mb-0"><strong>Telefone:</strong> (11) 98765-4321</p>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h5 class="mb-0">Editar Dados do Usuário</h5>
          </div>
          <div class="card-body p-4">
            <form id="formPerfil">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo:</label>
                <input type="text" class="form-control" id="nome" value="Lucas Mendes" required>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="emailPerfil" class="form-label">E-mail:</label>
                  <input type="email" class="form-control" id="emailPerfil" value="lucas@novaweb.com" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="telefone" class="form-label">Telefone:</label>
                  <input type="text" class="form-control" id="telefone" value="(11) 98765-4321">
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="departamento" class="form-label">Departamento:</label>
                  <input type="text" class="form-control" id="departamento" value="TI">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="cargo" class="form-label">Cargo:</label>
                  <input type="text" class="form-control" id="cargo" value="Desenvolvedor Front-end">
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2 mt-3">
                <button type="reset" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/javascript/script.js"></script>
</body>
</html>
