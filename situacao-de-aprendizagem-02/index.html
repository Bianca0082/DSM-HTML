<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NovaWeb Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <div class="container">
    <div class="login-box">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0">NovaWeb Studio</h4>
          <small>Acesso ao Sistema</small>
        </div>
        <div class="card-body p-4">
          <div id="avisoLogin" class="alert alert-danger py-2 d-none"></div>

          <form id="formLogin">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail:</label>
              <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" value="lucas@novaweb.com" required>
            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha:</label>
              <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" value="123456" required>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="lembrar" checked>
              <label class="form-check-label" for="lembrar">Lembrar-me</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/javascript/script.js"></script>
</body>
</html>
